<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whack A Carrot!</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC:400,700' rel='stylesheet' type='text/css'>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🥕" />
</head>
<body>

  <div class="header">
    <div class="top-row">
      <h1 >Whack-a-carrot!</h1>
      <div class="scoreboard"><span class="score">00</span></div>
    </div>
    <button onClick="startGame()">Start!</button>
  </div>

  <div class="game">
    <div class="hole hole1">
      <div class="carrot"></div>
    </div>
    <div class="hole hole2">
      <div class="carrot"></div>
    </div>
    <div class="hole hole3">
      <div class="carrot"></div>
    </div>
    <div class="hole hole4">
      <div class="carrot"></div>
    </div>
    <div class="hole hole5">
      <div class="carrot"></div>
    </div>
    <div class="hole hole6">
      <div class="carrot"></div>
    </div>
  </div>

<script>
  const holes = document.querySelectorAll('.hole');
  const scoreBoard = document.querySelector('.score');
  const carrots = document.querySelectorAll('.carrot');
  let lastHole;
  let timeUp = true;
  let score = 0;

  function randTime(min, max) {
    return Math.round(Math.random() * (max - min ) + min);
  }

  function randHole(holes) {
    const index = Math.floor(Math.random() * holes.length);
    const hole = holes[index];
    if(hole == lastHole){
      return randHole(holes);
    }

    lastHole = hole;
    return hole;
  }

  function peep() {
    const time = randTime(900, 1000);
    const hole = randHole(holes);
    hole.classList.add('up');
    setTimeout(() => {
      hole.classList.remove('up');
      if(!timeUp) peep();
    }, time);
  }

  function startGame() {
    if (!timeUp) return;
    scoreBoard.textContent = `00`;
    timeUp = false;
    score = 0;

    peep();
    setTimeout(() => timeUp = true, 10000);
  }

  function bonk(e) {
    if(!e.isTrusted) return; //fake click without mouse
    score++;
    this.classList.remove('up');
    scoreBoard.textContent = score < 10 ? `0${score}` : `${score}`;
  }

  carrots.forEach(carrot => carrot.addEventListener('click', bonk));

</script>
</body>
</html>
