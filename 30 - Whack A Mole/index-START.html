<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Whack A Carrot!</title>
  <link href='https://fonts.googleapis.com/css?family=Amatic+SC:400,700' rel='stylesheet' type='text/css'>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="https://fav.farm/🥕" />
</head>
<body>

  <div class="header">
    <div class="top-row">
      <h1 >Whack-a-carrot!</h1>
      <div class="scoreboard"><span class="score">00</span></div>
    </div>
    <div class="middle-row">
      <button data-mode="easy">Easy</button>
      <button data-mode="normal" class="normal selected">Normal</button>
      <button data-mode="hard">Hard</button>
    </div>
    <button class="start-button" onClick="startGame()">Start!</button>
  </div>

  <div class="game">
    <div class="hole hole1">
      <div class="carrot"></div>
    </div>
    <div class="hole hole2">
      <div class="carrot"></div>
    </div>
    <div class="hole hole3">
      <div class="carrot"></div>
    </div>
    <div class="hole hole4">
      <div class="carrot"></div>
    </div>
    <div class="hole hole5">
      <div class="carrot"></div>
    </div>
    <div class="hole hole6">
      <div class="carrot"></div>
    </div>
  </div>

  <div class="leaderboard">
    <h2>Leaderboard</h2>
    <div class="leaderboard-columns">
      <div>
        <h3>Easy</h3>
        <ol id="leaderboard-easy"></ol>
      </div>
      <div>
        <h3>Normal</h3>
        <ol id="leaderboard-normal"></ol>
      </div>
      <div>
        <h3>Hard</h3>
        <ol id="leaderboard-hard"></ol>
      </div>
    </div>
  </div>

<script>
  const holes = document.querySelectorAll('.hole');
  const scoreBoard = document.querySelector('.score');
  const carrots = document.querySelectorAll('.carrot');
  const modes = document.querySelectorAll('.middle-row button')
  let selectedMode = 'normal';
  let lastHole;
  let timeUp = true;
  let score = 0;

  function randTime(min, max) {
    return Math.round(Math.random() * (max - min ) + min);
  }

  function randHole(holes) {
    const index = Math.floor(Math.random() * holes.length);
    const hole = holes[index];
    if(hole == lastHole){
      return randHole(holes);
    }

    lastHole = hole;
    return hole;
  }

  function peep() {
    const speeds = {
      easy: [600, 1200],
      normal: [400, 1000],
      hard: [200, 600]
    };
    const [min, max] = speeds[selectedMode];
    const time = randTime(min, max);
    const hole = randHole(holes);
    hole.classList.add('up');
    setTimeout(() => {
      hole.classList.remove('up');
      if(!timeUp) peep();
    }, time);
  }

  function endRound() {
    timeUp = true;
    holes.forEach(hole => hole.classList.remove('up'));
    if (score > 0) saveScore(selectedMode, score);
    renderLeaderboard();
  }

  function startGame() {
    if (!timeUp) return;
    scoreBoard.textContent = `00`;
    timeUp = false;
    score = 0;

    peep();
    setTimeout(endRound, 10000);
  }

  function bonk(e) {
    if(!e.isTrusted) return; //fake click without mouse
    if(timeUp) return;
    score++;
    this.classList.remove('up');
    scoreBoard.textContent = score < 10 ? `0${score}` : `${score}`;
  }

  function setMode() {
    document.querySelector('.middle-row .selected').classList.remove('selected');
    this.classList.add('selected');
    selectedMode = this.dataset.mode;
  }

  renderLeaderboard();
  carrots.forEach(carrot => carrot.addEventListener('click', bonk));
  modes.forEach(modeBtn => modeBtn.addEventListener('click', setMode));

  function getLeaderboard() {
    const stored = localStorage.getItem('leaderboard');
    return stored ? JSON.parse(stored) : { easy: [], normal: [], hard: [] };
  }

  function saveScore(mode, newScore) {
    const leaderboard = getLeaderboard();
    leaderboard[mode].push(newScore);
    leaderboard[mode].sort((a, b) => b - a); // highest first
    leaderboard[mode] = leaderboard[mode].slice(0, 5); // keep top 5 only
    localStorage.setItem('leaderboard', JSON.stringify(leaderboard));
  }

  function renderLeaderboard() {
    const leaderboard = getLeaderboard();

    ['easy', 'normal', 'hard'].forEach(mode => {
      const list = document.getElementById(`leaderboard-${mode}`);
      list.innerHTML = ''; // clear old entries before re-rendering

      leaderboard[mode].forEach(score => {
        const li = document.createElement('li');
        li.textContent = score;
        if(score > 0) list.appendChild(li);
      });
    });
  }
</script>
</body>
</html>
